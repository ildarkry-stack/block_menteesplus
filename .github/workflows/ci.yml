name: Mentees Plus / Moodle CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: menteesplus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: Moodle ${{ matrix.moodle-version }} / PHP ${{ matrix.php }} / PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - {moodle-version: '5.0', moodle-branch: MOODLE_500_STABLE, php: '8.2'}
          - {moodle-version: '5.0', moodle-branch: MOODLE_500_STABLE, php: '8.4'}
          - {moodle-version: '5.1', moodle-branch: MOODLE_501_STABLE, php: '8.2'}
          - {moodle-version: '5.1', moodle-branch: MOODLE_501_STABLE, php: '8.4'}
          - {moodle-version: '5.2', moodle-branch: MOODLE_502_STABLE, php: '8.3'}
          - {moodle-version: '5.2', moodle-branch: MOODLE_502_STABLE, php: '8.4'}

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PLUGIN_PATH: ./plugin
      DB: pgsql
      PGPASSWORD: postgres
      MOODLE_BRANCH: ${{ matrix.moodle-branch }}

    steps:
      - name: Check out plugin
        uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, mbstring, intl, gd, curl, soap, zip, sodium
          ini-values: max_input_vars=5000, opcache.enable_cli=1
          coverage: none

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci '^4'
          echo "$(cd ci/bin && pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin && pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"

      - name: Check PostgreSQL
        run: psql -h 127.0.0.1 -U postgres -d postgres -c 'SELECT 1;'

      # A clean install catches plugin loading/DB errors not detected by lint alone.
      - name: Clean-install Moodle with plugin
        run: >-
          moodle-plugin-ci install
          --plugin "$PLUGIN_PATH"
          --db-type=pgsql
          --db-user=postgres
          --db-pass=postgres
          --db-host=127.0.0.1

      - name: PHP lint
        run: moodle-plugin-ci phplint "$PLUGIN_PATH"

      - name: Moodle plugin validation
        run: moodle-plugin-ci validate --moodle ./moodle "$PLUGIN_PATH"

      - name: Coding style
        run: moodle-plugin-ci phpcs --max-warnings 0 "$PLUGIN_PATH"

      - name: Upgrade savepoints
        run: moodle-plugin-ci savepoints "$PLUGIN_PATH"

      - name: PHPDoc
        run: moodle-plugin-ci phpdoc --moodle ./moodle --max-warnings 0 "$PLUGIN_PATH"

      - name: PHPUnit (mentee visibility, permissions, final grades)
        run: moodle-plugin-ci phpunit --moodle ./moodle --fail-on-warning "$PLUGIN_PATH"

  mysql:
    name: Moodle 5.2 / PHP 8.3 / MySQL 8.4
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: moodle
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmoodle"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PLUGIN_PATH: ./plugin
      DB: mysqli
      MOODLE_BRANCH: MOODLE_502_STABLE

    steps:
      - name: Check out plugin
        uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, intl, gd, curl, soap, zip, sodium
          ini-values: max_input_vars=5000, opcache.enable_cli=1
          coverage: none

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci '^4'
          echo "$(cd ci/bin && pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin && pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"

      - name: Clean-install Moodle with plugin
        run: >-
          moodle-plugin-ci install
          --plugin "$PLUGIN_PATH"
          --db-type=mysqli
          --db-user=root
          --db-pass=moodle
          --db-name=moodle
          --db-host=127.0.0.1

      - name: PHPUnit on MySQL
        run: moodle-plugin-ci phpunit --moodle ./moodle --fail-on-warning "$PLUGIN_PATH"
